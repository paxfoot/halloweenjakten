<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#160d22">
<title>Halloweenjakten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#160d22;--card:#2b1a42;--card2:#35214f;--ink:#f7efe0;--muted:#bba8d4;--orange:#ff8a1f;--orange2:#ffb347;--green:#7ee08a;--red:#ff6b6b;--line:rgba(255,255,255,.12);--r:18px;--c:#ff8a1f}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);background:var(--bg);background-image:radial-gradient(1000px 600px at 85% -10%,#3b1d5e 0%,transparent 60%),radial-gradient(800px 500px at -10% 110%,#3a1a10 0%,transparent 60%);background-attachment:fixed;min-height:100vh;line-height:1.45;font-size:17px}
a{color:inherit}
.top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:rgba(22,13,34,.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{text-decoration:none;font-weight:600}
.lang{font:inherit;font-weight:600;background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
main{max-width:560px;margin:0 auto;padding:12px 16px 60px}
h1,h2,h3{line-height:1.15;margin:0 0 .4em}
h2{font-size:22px}
.hero{text-align:center;padding:26px 0 8px}
.moon{width:80px;height:80px;margin:0 auto 12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6d6,#ffd98a 55%,#e8a94a);box-shadow:0 0 50px 10px rgba(255,200,110,.3)}
.kicker{text-transform:uppercase;letter-spacing:2px;font-size:13px;color:var(--orange2);margin:0 0 6px;font-weight:600}
.spooky{font-family:'Creepster',cursive;font-weight:400;font-size:50px;color:var(--orange);letter-spacing:1px;text-shadow:0 3px 0 #5a2600,0 0 24px rgba(255,138,31,.4)}
.lead{color:var(--muted);font-size:18px;margin:8px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:16px 0}
.card p{margin:.3em 0}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;margin:10px 0}
.steps li::before{content:counter(s);flex:0 0 30px;height:30px;border-radius:50%;background:var(--orange);color:#2a1200;font-weight:700;display:grid;place-items:center}
.tip{background:rgba(255,138,31,.12);border-radius:12px;padding:10px 12px;margin:12px 0 0;font-size:15px}
.section-h{margin:26px 0 10px}
.missions{display:grid;gap:12px}
.mcard{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:var(--r);padding:16px;transition:transform .15s}
.mcard:active{transform:scale(.98)}
.mrow{display:flex;gap:14px;align-items:center}
.mem{font-size:44px;line-height:1}
.mcard h3{font-size:21px;margin:0}
.mcard p{margin:2px 0 0;color:var(--muted);font-size:15px}
.bar{height:10px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;margin:12px 0 8px}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .5s}
.chip{display:inline-block;font-size:14px;font-weight:600;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.08)}
.chip.done{background:var(--green);color:#0d2a12}
.chip.claimed{border:1px solid var(--green);color:var(--green);background:transparent}
.btn{display:block;width:100%;text-align:center;text-decoration:none;font:inherit;font-weight:700;font-size:18px;padding:14px 18px;border-radius:14px;border:0;background:var(--orange);color:#2a1200;cursor:pointer;box-shadow:0 4px 0 #a54d00;margin-top:12px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #a54d00}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.green{background:var(--green);color:#0d2a12;box-shadow:0 4px 0 #3a8a45}
.back{display:inline-block;color:var(--muted);text-decoration:none;margin:6px 0 4px;font-size:15px}
.mhead{text-align:center;padding:6px 0}
.mhead .mem{font-size:64px}
.mhead h1{font-size:30px;margin-top:8px}
.muted{color:var(--muted)}
.story p{font-size:18px;margin:0 0 .8em}
.story p:first-child::first-letter{font-family:'Creepster',cursive;font-size:3em;float:left;line-height:.85;margin:4px 8px 0 0;color:var(--c)}
.goal{border:2px solid var(--c);border-radius:14px;padding:12px 14px;margin-top:4px;font-weight:600}
.goal span{display:block;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--c)}
details.again summary{cursor:pointer;color:var(--c);font-weight:600;margin-top:10px}
details.again[open] summary{margin-bottom:10px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-top:8px}
.slot{background:var(--card2);border:2px dashed var(--line);border-radius:14px;padding:10px 6px;text-align:center;font-size:14px;color:var(--muted)}
.slot .em{display:block;font-size:34px;line-height:1.25}
.slot .q{font-weight:700;color:rgba(255,255,255,.28)}
.slot .addr{display:block;margin-top:4px;font-size:12.5px;line-height:1.25;color:var(--ink);font-weight:600}
.slot.found{border:2px solid var(--c);color:var(--ink);background:rgba(255,255,255,.06)}
.clue{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.clue:first-of-type{border-top:0}
.clue .em{font-size:30px;line-height:1}
.clue b{display:block}
.sus{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.s{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;font:inherit;color:inherit}
button.s{cursor:pointer;border:2px solid var(--c)}
button.s:active{transform:scale(.97)}
.s .em{font-size:40px;display:block;line-height:1.2}
.s b{display:block;margin:4px 0 2px}
.s small{color:var(--muted);font-size:13px;line-height:1.3;display:block}
.s.out{opacity:.35;text-decoration:line-through;pointer-events:none;border-color:var(--line)}
.notice{border-radius:12px;padding:10px 12px;margin:12px 0 0;background:rgba(255,107,107,.15);border:1px solid rgba(255,107,107,.4)}
.reveal{background:rgba(126,224,138,.12);border-color:rgba(126,224,138,.45)}
.found-screen{text-align:center;padding-top:16px}
.found-screen h1{font-size:34px}
.pop{font-size:110px;line-height:1;margin:14px 0;display:inline-block;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both,float 3s ease-in-out .6s infinite}
@keyframes pop{0%{transform:scale(0) rotate(-25deg)}100%{transform:scale(1)}}
@keyframes float{50%{transform:translateY(-10px)}}
.scanner{position:relative;width:220px;height:220px;margin:22px auto 14px;border-radius:22px;overflow:hidden;background:radial-gradient(circle,rgba(57,255,106,.14),transparent 70%),repeating-linear-gradient(0deg,rgba(124,255,138,.08) 0 1px,transparent 1px 22px),repeating-linear-gradient(90deg,rgba(124,255,138,.08) 0 1px,transparent 1px 22px);border:2px solid rgba(124,255,138,.55);box-shadow:0 0 30px rgba(57,255,106,.25) inset}
.scanner .target{position:absolute;inset:0;display:grid;place-items:center;font-size:120px;animation:flicker .18s steps(2) infinite}
@keyframes flicker{50%{filter:drop-shadow(0 0 10px #39ff6a) hue-rotate(60deg);opacity:.85}}
.laser{position:absolute;left:-10%;right:-10%;height:4px;background:#c8ffd0;box-shadow:0 0 8px 3px #39ff6a,0 0 26px 10px rgba(57,255,106,.55);animation:sweep .9s ease-in-out infinite alternate}
@keyframes sweep{from{top:4%}to{top:95%}}
.scanner i{position:absolute;width:26px;height:26px;border:4px solid #7cff8a}
.scanner i:nth-of-type(1){top:8px;left:8px;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.scanner i:nth-of-type(2){top:8px;right:8px;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
.scanner i:nth-of-type(3){bottom:8px;left:8px;border-right:0;border-top:0;border-radius:0 0 0 8px}
.scanner i:nth-of-type(4){bottom:8px;right:8px;border-left:0;border-top:0;border-radius:0 0 8px 0}
.scan-text{font-family:ui-monospace,Menlo,monospace;color:#7cff8a;font-size:17px;letter-spacing:1px}
.scan-pct{font-family:ui-monospace,Menlo,monospace;color:#7cff8a;font-size:40px;font-weight:700;text-shadow:0 0 12px rgba(57,255,106,.6)}
.profile{max-width:420px;margin:14px auto;text-align:left;border:2px solid #7cff8a;background:rgba(57,255,106,.06)}
.profile h3{font-family:ui-monospace,Menlo,monospace;color:#7cff8a;letter-spacing:2px;text-transform:uppercase;font-size:15px}
.profile dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0}
.profile dt{color:var(--muted);font-size:15px}
.profile dd{margin:0;font-weight:600}
.scare span{opacity:.25}.scare span.on{opacity:1}
.quiz{text-align:center;padding-top:10px}
.quiz .teacher{font-size:64px;line-height:1;margin:8px 0 4px;animation:float 3s ease-in-out infinite}
.quiz h1{font-size:30px;margin:6px 0 10px}
.qvisual{margin:6px auto 14px}
.qsum,.qrow{font-size:40px;line-height:1.3;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 8px}
.qsum{font-size:30px;white-space:nowrap}
.qsum b{color:var(--c);font-size:36px;margin:0 2px}
.qmark{display:inline-block;width:46px;height:46px;line-height:46px;border-radius:12px;border:3px dashed var(--c);color:var(--c);font-weight:700;font-size:30px;vertical-align:middle}
.qmonster svg{width:190px;height:auto}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px}
.choices.n4{grid-template-columns:1fr 1fr}
.choice{font:inherit;color:var(--ink);background:var(--card2);border:3px solid var(--c);border-radius:20px;padding:16px 6px 12px;cursor:pointer;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .15s}
.choice:active{transform:scale(.95)}
.choice .cem{font-size:54px;line-height:1}
.choice .cbig{font-size:56px;font-weight:700;line-height:1;color:var(--c)}
.choice .clabel{font-size:16px;font-weight:600}
.choice.wrong{opacity:.35;border-color:var(--line);pointer-events:none;animation:shake .4s}
.choice.right{background:var(--green);border-color:var(--green);color:#0d2a12;transform:scale(1.06)}
.choice.right .cbig{color:#0d2a12}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.oops{font-size:22px;font-weight:700;margin-top:16px;color:var(--orange2)}
.diploma{background:#fff8e6;color:#3a2a10;border:6px double #c9a24a;border-radius:16px;padding:14px 16px;margin:14px 0}
.diploma span{display:block;font-family:'Creepster',cursive;font-size:30px;color:#8a5a00}
.qposter .pnum{font-size:4.6cqw;font-weight:700;color:var(--c);margin-top:5cqw}
.qposter .pnum span{display:none}
.qposter .pnum i{font-style:normal;opacity:.75;font-weight:600}
.qposter .pq{font-size:8.8cqw;line-height:1.1;margin:2.5cqw 0 0;font-weight:700}
.qposter .pqen{font-size:4.3cqw;color:var(--muted);margin:1.5cqw 0 0}
.qposter .pvis{margin-top:2.5cqw;width:100%}
.qposter .qsum,.qposter .qrow{font-size:7.4cqw;padding:2.5cqw 2cqw;border-radius:4cqw;background:rgba(255,255,255,.06)}
.qposter .qsum b{font-size:6.6cqw}
.qposter .qmark{width:10cqw;height:10cqw;line-height:10cqw;font-size:6.5cqw;border-radius:2.5cqw;border-width:.6cqw}
.qposter .qmonster svg{width:29cqw}
.qposter .pqr{width:34cqw}
.qposter .pinfo{font-size:3.6cqw;margin-top:2cqw}
.poster.sign.qposter .pqr b{white-space:normal;font-size:3cqw}
.qpics{display:grid;gap:2.4cqw}
.qpics.n3{grid-template-columns:repeat(3,1fr)}
.qpics.n4{grid-template-columns:repeat(4,1fr)}
.qpics div{background:rgba(255,255,255,.06);border:.5cqw solid var(--c);border-radius:3.5cqw;padding:2.5cqw 1cqw}
.qpics span{display:block;font-size:11cqw;line-height:1.1}
.qpics b{display:block;font-size:3.6cqw;margin-top:1cqw}
.qpics i{display:block;font-style:normal;font-size:2.8cqw;color:var(--muted)}
.cardvis .qpics{gap:6px}
.cardvis .qpics div{border:2px solid #ccc;border-radius:10px;padding:6px 2px;background:#f3f0fa}
.cardvis .qpics span{font-size:30px}
.cardvis .qpics b{font-size:12px;color:#222}
.cardvis .qpics i{font-size:10px;color:#666}
.cardq{margin-top:8px;border-top:1px dashed #bbb;padding-top:8px}
.cardq b{display:block;font-size:18px}
.cardq i{display:block;font-style:normal;color:#666;font-size:13px}
.cardvis{margin-top:6px}
.cardvis .qsum,.cardvis .qrow{font-size:22px;padding:6px;background:#f3f0fa;border:0;color:#222}
.cardvis .qsum b{font-size:20px}
.cardvis .qmark{width:26px;height:26px;line-height:22px;font-size:16px;border-width:2px}
.cardvis .qmonster svg{width:110px}
.catart svg{display:block;height:auto}
.pop .catart svg{width:170px;filter:drop-shadow(0 0 18px rgba(192,139,255,.55))}
.slot .catart svg{width:74px;margin:-4px auto 2px}
.item-name{font-size:26px;color:var(--c)}
.speech{background:#fff;color:#2a1b3d;border-radius:16px;padding:14px 16px;margin:14px auto;max-width:420px;font-size:18px;text-align:left}
.speech .lbl{display:block;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#8a5a00;font-weight:700;margin-bottom:2px}
.claim{text-align:center;border:3px solid var(--c);background:linear-gradient(180deg,var(--card2),var(--card));border-radius:24px;padding:26px 18px 20px;margin-top:10px;position:relative;overflow:hidden}
.claim>*{position:relative}
.claim h1{font-family:'Creepster',cursive;font-weight:400;font-size:46px;color:var(--orange);margin-top:8px}
.claim .mem{font-size:80px;display:inline-block}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.1) rotate(4deg)}}
.clock{display:inline-flex;gap:8px;align-items:baseline;background:#0e0816;border-radius:12px;padding:8px 14px;margin:8px 0;font-variant-numeric:tabular-nums}
.clock b{font-size:28px;color:var(--green)}
.fall{position:absolute!important;top:-40px;font-size:22px;animation:fall linear infinite;opacity:.75;pointer-events:none}
@keyframes fall{to{transform:translateY(700px) rotate(360deg)}}
.times{list-style:none;padding:0;margin:6px 0 0}
.times li{padding:8px 0;border-top:1px solid var(--line)}
.times li:first-child{border-top:0}
.house{display:flex;gap:10px;align-items:flex-start;text-align:left}
.dot{flex:0 0 12px;height:12px;border-radius:50%;margin-top:6px;background:var(--green);box-shadow:0 0 10px var(--green)}
.house.off{opacity:.45}.house.off .dot{background:#777;box-shadow:none}
.house.out .dot{background:var(--red)}
.house small{display:block;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:16px;z-index:50}
.modal .card{max-width:420px;width:100%;margin:0;text-align:center}
.hurry{background:rgba(255,179,71,.18);border:1px solid var(--orange2);border-radius:12px;padding:10px 12px;margin:4px 0 12px;font-weight:600}
.hurry.last{background:rgba(255,107,107,.22);border-color:var(--red);animation:pulse 1.6s ease-in-out infinite}
.countdown{display:flex;gap:8px;justify-content:center;margin:12px 0 4px}
.countdown div{background:var(--card2);border:1px solid var(--line);border-radius:14px;min-width:68px;padding:10px 6px;text-align:center}
.countdown b{display:block;font-size:30px;line-height:1;color:var(--orange);font-variant-numeric:tabular-nums}
.countdown span{font-size:13px;color:var(--muted)}
.mcard.locked{opacity:.92}
.btn.lockedbtn{background:var(--card2);color:var(--muted);border:2px dashed var(--line);box-shadow:none;cursor:default}
.helpcard{border:2px solid var(--orange);background:linear-gradient(180deg,rgba(255,138,31,.14),var(--card))}
.helpcard h2{font-size:21px}
.helpmodal{text-align:left}
.helpmodal p{margin:.6em 0}
.helpmodal .phone{font-size:20px;white-space:nowrap}
.modal .card{max-height:90vh;overflow:auto}
img.emo{height:1em;width:auto;vertical-align:-.12em;display:inline-block}
img.emo[alt="🇬🇧"],img.emo[alt="🇸🇪"]{height:.8em;vertical-align:-.04em;border-radius:2px}
.stats h2{margin-bottom:12px}
.stiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stile{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stile b{display:block;font-size:30px;color:var(--orange);line-height:1.1}
.stile span{font-size:14px;font-weight:600}
.stile small{display:block;font-size:12px;color:var(--muted)}
.stable{width:100%;border-collapse:collapse;margin:14px 0 6px;font-size:15px}
.stable th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:right;font-weight:600;padding:4px 6px}
.stable th:first-child,.stable td:first-child{text-align:left}
.stable td{padding:7px 6px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.sitems{margin-top:8px}
.sitems summary{cursor:pointer;font-weight:600;padding:6px 0}
.sitems ul{list-style:none;margin:0;padding:0 0 6px}
.sitems li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--line);font-size:15px}
.sitems li small{color:var(--muted)}
.sitems li.low b{color:var(--red)}
/* organizer */
.org h1{font-size:28px}
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:10px 0 24px}
.qr-card{background:#fff;color:#1b1b1b;border-radius:14px;padding:14px;text-align:center;break-inside:avoid}
.qr-card .qr{display:flex;justify-content:center;margin:8px 0}
.qr-card .qr img,.qr-card .qr canvas{width:190px!important;height:190px!important}
.qr-card h3{font-size:22px;margin:2px 0}
.qr-card .em{font-size:34px;line-height:1}
.qr-card .scan{font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:13px;color:#a54d00}
.qr-card small{color:#555;display:block}
.qr-card.start{border:4px solid #ff8a1f}
.sign-addr{display:block;margin-top:4px;font-size:15px}
.test{display:block;margin-top:6px;font-size:13px;color:#6b3fa0}
.warn{background:#ffe08a;color:#3a2a00;border-radius:12px;padding:12px;margin:12px 0}
.row{display:flex;gap:10px}
.row .btn{margin-top:0}
/* posters */
.poster-wrap{container-type:inline-size;max-width:520px;margin:0 auto 22px}
.poster{position:relative;aspect-ratio:210/297;overflow:hidden;border-radius:3cqw;border:1.2cqw solid var(--c);color:var(--ink);display:flex;flex-direction:column;align-items:center;text-align:center;padding:6cqw 6cqw 5cqw;background:linear-gradient(180deg,#2b1442 0%,#160d22 58%,#2a1208 100%);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.poster::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 26%,var(--c),transparent 58%);opacity:.22}
.poster>*{position:relative;flex-shrink:0}
.pkick{font-size:2.9cqw;letter-spacing:.35cqw;padding:0 8cqw;text-transform:uppercase;color:var(--orange2);font-weight:600;margin:0}
.pmoon{position:absolute!important;top:5cqw;right:6cqw;width:11cqw;height:11cqw;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6d6,#ffd98a 55%,#e8a94a);box-shadow:0 0 8cqw 2cqw rgba(255,200,110,.35)}
.ptitle{font-family:'Creepster',cursive;font-weight:400;font-size:13cqw;line-height:1;margin:5cqw 0 0;color:var(--orange);text-shadow:0 .8cqw 0 #5a2600}

/* =========================================================
   The app (no need to change anything below)
   ========================================================= */
const VERSION = "26 okt 08:50";
const KEY = "halloweenjakten-2026";
let S = {};
try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { S = {}; }
function fresh(keepLang, keepOrg) { return { lang: keepLang, organizer: keepOrg, found: {}, started: {}, solved: {}, wrong: {}, claimed: {} }; }
S = Object.assign(fresh(S.lang), S);
if (!S.lang) S.lang = (navigator.language || "").toLowerCase().startsWith("sv") ? "sv" : "en";
const OPENS = new Date(EVENT.opensAt).getTime();
const CLOSES = new Date(EVENT.closesAt).getTime();
const GRACE_END = CLOSES + (EVENT.graceMinutes || 0) * 60000;
const isOpen = () => Date.now() >= OPENS || !!S.organizer;
const canClaim = m => isComplete(m) && isSolved(m) && !S.claimed[m.id];
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const app = document.getElementById("app");
const modalRoot = document.getElementById("modalRoot");
const t = (k, ...a) => { const v = T[S.lang][k]; return typeof v === "function" ? v(...a) : v; };
const L = o => (o == null ? "" : typeof o === "string" ? o : (o[S.lang] || o.sv || ""));
const byId = id => MISSIONS.find(m => m.id === id);
const count = m => m.items.filter(i => S.found[i.code]).length;
const isComplete = m => count(m) === m.items.length;
const isSolved = m => !m.suspects || !!S.solved[m.id];
const itemEmoji = (m, it) => it.emoji || m.emoji;
const itemArt = (m, it, headOnly) => (m.id === "katterna" && typeof CAT_ART !== "undefined" && CAT_ART[it.name])
  ? `<span class="catart${headOnly ? " head" : ""}">${catSVG(CAT_ART[it.name], headOnly)}</span>` : itemEmoji(m, it);

function findCode(code) {
  for (const m of MISSIONS) for (const it of m.items) if (it.code === code) return { m, it };
  return null;
}

function statusChip(m) {
  if (S.claimed[m.id]) return `<span class="chip claimed">${t("claimed")}</span>`;
  if (isComplete(m) && isSolved(m)) return `<span class="chip done">${t("done")}</span>`;
  if (isComplete(m)) return `<span class="chip done">${t("readyToSolve")}</span>`;
  if (!S.started[m.id] && count(m) === 0) return `<span class="chip">${t("notStarted")}</span>`;
  return `<span class="chip">${t("progress", count(m), m.items.length)}</span>`;
}

  const times = EVENT.prizeTimes.map(x => `<li>🕔 ${L(x)}</li>`).join("");
  const houses = EVENT.sheetUrl ? "sheet" : EVENT.prizeHouses.map(x => `<li>🏠 ${L(x)}</li>`).join("");
  app.innerHTML = `
    <section class="hero">
      <div class="moon"></div>
      <p class="kicker">${L(EVENT.date)}</p>
      <h1 class="spooky">${t("appTitle")}</h1>

    <div class="missions">

          <div class="mrow">

            <div><h3>${L(m.title)}</h3><p>${L(m.tagline)}</p></div>

          <div class="bar"><i style="width:${(count(m) / m.items.length) * 100}%"></i></div>

    </div>
    ${times || houses ? `

      <h2>🎁 ${t("prizes")}</h2>

}

let RERENDER_AT = 0;
const fmtTime = sec => {
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  const mmss = String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  return (d ? d + "d " : "") + (d || h ? h + ":" : "") + mmss;
};
function tick() {
  if (RERENDER_AT && Date.now() >= RERENDER_AT) { RERENDER_AT = 0; render(); return; }
  const ecd = document.getElementById("endcd");
  if (ecd) {
    const now = Date.now(), target = now < CLOSES ? CLOSES : GRACE_END;
    const left = Math.max(0, Math.floor((target - now) / 1000));
    ecd.textContent = fmtTime(left);
    const w = document.getElementById("endwarn");
    const html = now >= CLOSES ? `<div class="hurry last">${t("lastChance")}</div>` : left <= 900 ? `<div class="hurry">${t("hurry")}</div>` : "";
    if (w.innerHTML !== html) w.innerHTML = html;
  }
  const cd = document.getElementById("countdown");
  if (cd) {
    let left = Math.max(0, Math.floor((OPENS - Date.now()) / 1000));
    const parts = [Math.floor(left / 86400), Math.floor(left % 86400 / 3600), Math.floor(left % 3600 / 60), left % 60];
    cd.innerHTML = parts.map((n, i) => `<div><b>${String(n).padStart(2, "0")}</b><span>${t("units")[i]}</span></div>`).join("");
  }
  const el = document.getElementById("clock");
  if (el) el.textContent = new Date().toLocaleTimeString(S.lang === "sv" ? "sv-SE" : "en-GB", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}

let statTimer = 0;
function track(...keys) {

/* ---------- Prize houses from Google Sheet ---------- */
let HOUSES = null; // null = loading, "error", or list of {name, open, note}
function sheetCsvUrl(u) {
  const id = (u.match(/\/d\/([a-zA-Z0-9_-]+)/) || [])[1];
  if (!id) return u;
  const gid = (u.match(/[#&?]gid=(\d+)/) || [])[1];
  return `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv${gid ? "&gid=" + gid : ""}&t=${Date.now()}`;
}
function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
// Column B: "Öppet", "Slut" or "Stängt" (old checkboxes TRUE/FALSE also work)
function houseStatus(v) {
  v = (v || "").trim().toLowerCase();
  if (/^(öppet|öppen|open|true|ja|yes|x|1|sant)$/.test(v)) return "open";
  if (/^(slut|slutsåld|slut på belöningar|out|sold out)$/.test(v)) return "out";
  return "closed";
}
async function loadHouses() {
  if (!EVENT.sheetUrl) return;
  try {
    const res = await fetch(sheetCsvUrl(EVENT.sheetUrl), { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    HOUSES = parseCSV(await res.text()).slice(1)
      .map(r => ({ name: (r[0] || "").trim(), status: houseStatus(r[1]), note: (r[2] || "").trim() }))
      .filter(h => h.name);
  } catch (e) { if (HOUSES === null) HOUSES = "error"; }
  document.querySelectorAll("[data-houses]").forEach(el => el.innerHTML = housesHTML());
}
function housesHTML() {
  if (!EVENT.sheetUrl) {
    return `<p class="muted">${t("prizeHouses")}</p><ul class="times">${EVENT.prizeHouses.map(x => `<li>🏠 ${L(x)}</li>`).join("")}</ul>`;
  }
  if (HOUSES === null) return `<p class="muted">${t("loadingHouses")}</p>`;
  if (HOUSES === "error") return `<p class="muted">${t("housesError")}</p>`;
  const by = st => HOUSES.filter(h => h.status === st);
  const label = { open: "", out: ` (${t("outLabel")})`, closed: ` (${t("closed")})` };
  const li = h => `<li class="house ${h.status === "open" ? "" : "off " + h.status}"><span class="dot"></span><span>${esc(h.name)}${label[h.status]}${h.note ? `<small>${esc(h.note)}</small>` : ""}</span></li>`;
  return `<p class="muted">${t("openNow")}</p>
    ${by("open").length ? "" : `<p>${t("noneOpen")}</p>`}
    <ul class="times">${by("open").map(li).join("")}${by("out").map(li).join("")}${by("closed").map(li).join("")}</ul>`;
}
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
loadHouses();
setInterval(loadHouses, 60000);

/* ---------- Scanning a QR code ---------- */
function scan(code) {
  const hit = findCode(code);
  if (!hit) {
    app.innerHTML = `
      <section class="found-screen">
        <div class="pop">🤔</div>
        <h1>${t("unknownCode")}</h1>
        <a class="btn" href="#/">${t("toHome")}</a>
      </section>`;
    return;
  }
  const { m, it } = hit;
  if (it.quiz && !S.found[code]) { markStarted(m.id); return quizView(code, m, it); }
  const already = !!S.found[code] && !scan.fresh;
  scan.fresh = false;
  if (m.scanFx && !scan.animating) return scanAnimation(code, m, it);
  scan.animating = false;
  if (!S.found[code]) track("found:" + code);
  markStarted(m.id);
  S.found[code] = true; save();
  const n = count(m), total = m.items.length, done = n === total;
  let btnText = t("toMission");
  if (done) btnText = S.claimed[m.id] ? t("toMission") : (isSolved(m) ? t("seePrize") : t("solveCase"));
  app.innerHTML = `
    <section class="found-screen" style="--c:${m.color}">
      <p class="kicker">${L(m.title)}</p>
      <div class="pop">${itemArt(m, it)}</div>
      <h1>${already ? t(it.quiz ? "alreadyAnswered" : "alreadyFound") : L(m.foundVerb)}</h1>
      <h2 class="item-name">${L(it.name)}</h2>
      <p class="speech">${m.suspects ? `<span class="lbl">${t("clue")}</span>` : ""}${m.suspects ? "" : "“"}${L(it.line)}${m.suspects ? "" : "”"}</p>
      ${it.profile ? `
      <section class="card profile">
        <h3>📡 ${t("profileTitle")}</h3>
        <dl>
          <dt>${t("pAge")}</dt><dd>${L(it.profile.age)}</dd>
          <dt>${t("pType")}</dt><dd>${L(it.profile.type)}</dd>
          <dt>${t("pLikes")}</dt><dd>${L(it.profile.likes)}</dd>
          <dt>${t("pPower")}</dt><dd>${L(it.profile.power)}</dd>

        </dl>
      </section>` : ""}

      <p class="muted">${t("progress", n, total)}</p>
      ${done ? `<h2>🎉 ${t("allFound")}</h2>` : ""}
      <a class="btn" href="#/m/${m.id}">${btnText}</a>

/* Green laser scan, then show the result */
function scanAnimation(code, m, it) {
  const route = ROUTE, DURATION = 2800;
  app.innerHTML = `
    <section class="found-screen" style="--c:${m.color}">
      <p class="kicker">${L(m.title)}</p>
      <div class="scanner"><div class="target">${itemEmoji(m, it)}</div><div class="laser"></div><i></i><i></i><i></i><i></i></div>
      <div class="scan-pct" id="scanPct">0%</div>
      <p class="scan-text">${t("analysing")}<span id="scanDots"></span></p>
    </section>`;
  const start = Date.now();
  const timer = setInterval(() => {
    const pct = Math.min(100, Math.round((Date.now() - start) / DURATION * 100));
    const el = document.getElementById("scanPct"), dots = document.getElementById("scanDots");
    if (el) el.textContent = pct + "%";
    if (dots) dots.textContent = ".".repeat(Math.floor((Date.now() - start) / 300) % 4);
    if (pct >= 100) {
      clearInterval(timer);
      if (ROUTE !== route) return;
      try { navigator.vibrate && navigator.vibrate([60, 40, 60]); } catch (e) {}
      scan.animating = true;
      scan(code);
    }
  }, 50);
}

/* Sharp vector emojis everywhere (Noto Emoji, Apache 2.0 – see emoji/CREDITS.txt), so the
   app looks the same on every phone and matches the printed posters.
   NOTE: when adding a new emoji to the texts, also add its SVG to the emoji/ folder. */
const EMOJI_FILES = new Set(["1f1ec_1f1e7", "1f1f8_1f1ea", "1f319", "1f342", "1f36c", "1f36d", "1f381", "1f382", "1f383", "1f389", "1f393", "1f3e0", "1f3eb", "1f3f7", "1f408_200d_2b1b", "1f43a", "1f43e", "1f440", "1f442", "1f463", "1f47b", "1f480", "1f4a1", "1f4ac", "1f4ca", "1f4cd", "1f4d6", "1f4e1", "1f4f1", "1f4f7", "1f504", "1f50a", "1f50d", "1f512", "1f513", "1f526", "1f554", "1f575", "1f577", "1f578", "1f5a8", "1f5bc", "1f5d2", "1f634", "1f64b", "1f914", "1f915", "1f987", "1f989", "1f9c4", "1f9db", "1f9e9", "1f9f9", "1f9fb", "23f0", "23f3", "2600", "26a0", "2753", "2b50"]);
function vectorEmojis(root) {
  const isEmo = c => { const o = c.codePointAt(0); return o >= 0x1f000 || (o >= 0x2300 && o <= 0x23ff) || (o >= 0x2600 && o <= 0x27bf) || (o >= 0x2b00 && o <= 0x2bff); };
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node => {
    const chars = [...node.nodeValue];
    if (!chars.some(isEmo)) return;
    const frag = document.createDocumentFragment(); let text = "", i = 0, swapped = 0;
    while (i < chars.length) {
      if (!isEmo(chars[i])) { text += chars[i++]; continue; }
      let j = i + 1;
      const isRI = c => { const o = c.codePointAt(0); return o >= 0x1f1e6 && o <= 0x1f1ff; };
      if (isRI(chars[i]) && j < chars.length && isRI(chars[j])) j++;
      else while (j < chars.length && (chars[j] === "\ufe0f" || chars[j] === "\u200d" || (chars[j - 1] === "\u200d" && isEmo(chars[j])))) j++;
      const seq = chars.slice(i, j).join("");
      const key = [...seq].filter(c => c !== "\ufe0f").map(c => c.codePointAt(0).toString(16).padStart(4, "0")).join("_");
      if (EMOJI_FILES.has(key)) {
        if (text) { frag.appendChild(document.createTextNode(text)); text = ""; }
        const img = document.createElement("img");
        img.className = "emo"; img.alt = seq; img.src = "emoji/emoji_u" + key + ".svg";
        frag.appendChild(img); swapped++;
      } else text += seq;
      i = j;
    }
    if (!swapped) return; // nothing to swap: leave the text alone (prevents an endless loop)
    if (text) frag.appendChild(document.createTextNode(text));
    node.parentNode.replaceChild(frag, node);
  });
}

const emojiObserver = new MutationObserver(list => {
  for (const m of list) for (const n of m.addedNodes) {
    if (n.nodeType === 1 && n.tagName !== "IMG") vectorEmojis(n);
    else if (n.nodeType === 3 && n.parentNode) vectorEmojis(n.parentNode);
  }
});
function startEmojiObserver() {
  vectorEmojis(document.body);
  emojiObserver.observe(document.body, { childList: true, subtree: true });
}

/* ---------- Statistics box on the organizer page ---------- */
async function loadStats() {
  const box = document.getElementById("statsBox");
  if (!box || !EVENT.statsUrl) return;
  try {
    const res = await fetch(EVENT.statsUrl + (EVENT.statsUrl.includes("?") ? "&" : "?") + "t=" + Date.now());
    const data = await res.json();
    if (document.getElementById("statsBox")) renderStats(data.counts || {});
  } catch (e) {
    if (box.isConnected && !box.dataset.ok) box.textContent = t("statsError");
  }
}
function renderStats(c) {
  const box = document.getElementById("statsBox");
  const n = k => Number(c[k]) || 0;
  const sum = pre => Object.keys(c).filter(k => k.startsWith(pre)).reduce((a, k) => a + n(k), 0);
  const tile = (num, label, sub) => `<div class="stile"><b>${num}</b><span>${label}</span>${sub ? `<small>${sub}</small>` : ""}</div>`;
  box.dataset.ok = "1";
  box.innerHTML = `
    <div class="stiles">
      ${tile(n("phones"), t("stPhones"))}
      ${tile(sum("view:"), t("stViews"))}
      ${tile(sum("claimed:"), t("stClaimed"))}
      ${tile(n("help:sms"), t("stHelp"), t("stHelpDetail", n("help:open"), n("help:sms")))}
    </div>
    <table class="stable">
      <tr><th>${t("stMission")}</th><th>${t("stStarted")}</th><th>${t("stDone")}</th><th>${t("stRewards")}</th></tr>
      ${MISSIONS.map(m => `<tr><td>${m.emoji} ${L(m.title)}</td><td>${n("start:" + m.id)}</td><td>${n("done:" + m.id)}</td><td>${n("claimed:" + m.id)}</td></tr>`).join("")}
    </table>
    ${MISSIONS.map(m => {
      const counts = m.items.map(it => n("found:" + it.code)), low = Math.min(...counts);
      return `<details class="sitems"><summary>${m.emoji} ${L(m.title)} – ${t("stItems")}</summary>
        <ul>${m.items.map((it, i) => `<li class="${counts[i] === low && Math.max(...counts) > low ? "low" : ""}"><span>${L(it.name)}${it.where ? ` <small>(${it.where})</small>` : ""}</span><b>${counts[i]}</b></li>`).join("")}</ul>
      </details>`;
    }).join("")}
    <p class="muted" style="font-size:13px;margin:10px 0 0">${t("statsUpdated")} ${new Date().toLocaleTimeString(S.lang === "sv" ? "sv-SE" : "en-GB", { hour: "2-digit", minute: "2-digit" })}</p>`;
}
setInterval(() => { if (document.getElementById("statsBox")) loadStats(); }, 60000);

/* Shrink poster titles until they fit on one line */
function fitTitles() {
  document.querySelectorAll(".ptitle").forEach(el => {
    el.style.fontSize = "";
    let size = parseFloat(getComputedStyle(el).fontSize) / el.clientWidth * 100;
    while (el.scrollWidth > el.clientWidth + 1 && size > 5) { size -= 0.25; el.style.fontSize = size + "cqw"; }
  });
}

      : `<div class="pbig">${itemEmoji(m, it)}</div>`;
    return `
      <div class="poster-wrap"><div class="poster mission sign" style="--c:${m.color}">
        <span class="pdeco" style="top:3cqw;left:4cqw">${d[0]}</span>
        <span class="pdeco" style="top:5cqw;right:5cqw">${d[1]}</span>
        <span class="pdeco" style="bottom:4cqw;left:5cqw">${d[2]}</span>
        <span class="pdeco" style="bottom:4cqw;right:5cqw;transform:scaleX(-1)">${d[3]}</span>
        <p class="pkick">${m.title.sv} · ${m.title.en}</p>
        ${art}
        <h1 class="ptitle">${name.sv}</h1>
        ${name.en !== name.sv ? `<p class="psub">${name.en}</p>` : ""}
        <p class="ptext">${m.signText.sv}<br><i>${m.signText.en}</i></p>
        <div class="pqr"><div class="qr" data-qr="${base}#/q/${it.code}"></div><b>Scanna mig! · Scan me!</b></div>
      </div></div>`;
  }).join("");
}

/* ---------- Modal ---------- */
function openModal(inner, noBackdropClose) {
  modalRoot.innerHTML = `<div class="modal" ${noBackdropClose ? "" : 'data-act="closeModal"'}><div class="card">${inner}</div></div>`;
}
function closeModal() { modalRoot.innerHTML = ""; }

/* ---------- Clicks ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "closeModal" && e.target !== el) return; // only backdrop clicks close
  if (act === "start") { markStarted(el.dataset.m); render(); window.scrollTo(0, 0); }
  if (act === "answer") answer(el);
  if (act === "guess") guess(el.dataset.m, el.dataset.s);
  if (act === "claim") {
    openModal(`
      <div style="font-size:54px">🎁</div>
      <h2>${t("confirmTitle")}</h2>
      <p>${t("confirmText")}</p>
      <button class="btn green" type="button" data-act="confirmClaim" data-m="${el.dataset.m}">${t("yes")}</button>
      <button class="btn ghost" type="button" data-act="closeModal">${t("cancel")}</button>`);
  }
  if (act === "confirmClaim") { S.claimed[el.dataset.m] = Date.now(); save(); track("claimed:" + el.dataset.m); closeModal(); render(); window.scrollTo(0, 0); }
  if (act === "closeModal") closeModal();
  if (act === "closeAndRender") { closeModal(); render(); window.scrollTo(0, 0); }
  if (act === "helpInfo") {
    track("help:open");
    const ph = EVENT.helperPhone, digits = (ph || "").replace(/[^\d+]/g, "");
    openModal(`
      <div class="helpmodal">
        <div style="font-size:54px;text-align:center">🏠🎁</div>
        <h2 style="text-align:center">${t("helpTitle")}</h2>
        ${t("helpBody").map(x => `<p>${x}</p>`).join("")}
        ${ph ? `
        <p style="text-align:center;margin-top:14px">${t("helpOr")} <b class="phone">${ph}</b></p>
        <a class="btn green" href="sms:${digits}">💬 ${t("helpCta")}</a>` : ""}
        <button class="btn ghost" type="button" data-act="closeModal">${t("close")}</button>
      </div>`);
  }
  if (act === "statsRefresh") loadStats();
  if (act === "orgStyle") {
    S.orgLight = el.dataset.style === "light"; save();
    document.querySelector(".org").dataset.style = el.dataset.style;
    document.querySelectorAll("[data-act=orgStyle]").forEach(b => b.classList.toggle("on", b.dataset.style === el.dataset.style));
    fitTitles();
  }
  if (act === "orgSize") {
    ORG_SIZE = el.dataset.size;
    document.querySelector(".org").dataset.size = ORG_SIZE;
    document.querySelectorAll("[data-act=orgSize]").forEach(b => b.classList.toggle("on", b.dataset.size === ORG_SIZE));
  }
  if (act === "printSigns") {
    document.querySelectorAll(".print-on").forEach(x => x.classList.remove("print-on"));
    const set = document.querySelector(`.sign-set[data-m="${el.dataset.m}"]`);
    set.classList.add("print-on");
    set.querySelector(el.dataset.size === "big" ? ".big-signs" : ".small-signs").classList.add("print-on");
    document.body.dataset.print = "signs";
    window.print();
  }
  if (act === "lockPreview") { S.organizer = false; save(); go("#/"); }
  if (act === "print") { document.body.dataset.print = el.dataset.what || ""; window.print(); }
  if (act === "reset") { if (confirm(t("resetConfirm"))) { S = fresh(S.lang, S.organizer); save(); alert(t("resetDone")); } }
});

document.getElementById("langBtn").addEventListener("click", () => {
  S.lang = S.lang === "sv" ? "en" : "sv"; save(); render();
});

/* ---------- Router ---------- */
function render() {
  document.documentElement.lang = S.lang;
  document.getElementById("langBtn").textContent = S.lang === "sv" ? "🇬🇧 EN" : "🇸🇪 SV";
  document.getElementById("brandName").textContent = t("appTitle");
  document.title = t("appTitle");
  const parts = ROUTE.replace(/^#\/?/, "").split("/");
  if (parts[0] === "arrangor" || parts[0] === "organizer") return organizer();
  const now = Date.now();
  RERENDER_AT = [OPENS, CLOSES, GRACE_END].find(x => x > now) || 0;
  if (!isOpen()) return parts[0] === "q" ? tooEarly() : (parts[0] === "m" && byId(parts[1])) ? lockedStory(byId(parts[1])) : comingSoon();
  if (now >= CLOSES && !S.organizer) {
    const m = parts[0] === "m" ? byId(parts[1]) : null;
    if (m && canClaim(m) && now < GRACE_END) return claimView(m);
    return closedPage();
  }
  if (parts[0] === "q" && parts[1]) return scan(parts[1]);
  if (parts[0] === "m" && parts[1]) return missionPage(parts[1]);
  if (parts[0] === "arrangor" || parts[0] === "organizer") return organizer();
  home();
}
/* The app keeps track of the current page itself, so it also works
   inside previews where normal links are blocked. */
let ROUTE = location.hash || "#/";
function go(hash) {
  ROUTE = hash || "#/";
  try { if (location.hash !== ROUTE) history.pushState(null, "", ROUTE); } catch (e) {}
  closeModal(); render(); trackView(); try { window.scrollTo(0, 0); } catch (e) {}
}
document.addEventListener("click", e => {
  if (e.target.closest('a[href^="sms:"]')) { track("help:sms"); flushStats(); }
  const a = e.target.closest("a[href]");
  if (!a) return;
  const href = a.getAttribute("href");
  const i = href.indexOf("#");
  if (i === -1) return;
  e.preventDefault();
  go(href.slice(i));
}, true);
const fromLocation = () => { if (location.hash && location.hash !== ROUTE) { ROUTE = location.hash; closeModal(); render(); trackView(); } };
startEmojiObserver();
window.addEventListener("hashchange", fromLocation);
window.addEventListener("popstate", () => { ROUTE = location.hash || "#/"; closeModal(); render(); trackView(); });
render();
trackView();
</script>
</body>
</html>
