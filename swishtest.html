<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Swish-test</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#160d22;color:#f7efe0;line-height:1.45}
main{max-width:520px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:24px;margin:0 0 6px}p{margin:.4em 0;color:#bba8d4}
a.t{display:block;margin:14px 0 0;padding:14px 16px;border-radius:14px;background:#ff8a1f;color:#2a1200;font-weight:700;font-size:18px;text-decoration:none}
a.t small{display:block;font-weight:500;font-size:14px;color:#4a2400}
</style></head><body><main>
<h1>Swish-test</h1>
<p>Tryck på knapparna en i taget. Skriv ner vilka nummer som öppnar Swish med <b>070-667 23 21</b> ifyllt. Du behöver inte betala – avbryt bara i Swish.</p>
<div id="list"></div>
</main><script>
const n = "46706672321";
const data = o => "swish://payment?data=" + encodeURIComponent(JSON.stringify(o));
const tests = [
  ["Inget belopp, du väljer själv", "https://app.swish.nu/1/p/sw/?sw=" + n + "&cur=SEK&msg=Haggween&edit=amt,msg&src=qr"],
  ["Förifyllt 20 kr, går att ändra", "https://app.swish.nu/1/p/sw/?sw=" + n + "&amt=20&cur=SEK&msg=Haggween&edit=amt&src=qr"],
  ["Förifyllt 20 kr, låst", "https://app.swish.nu/1/p/sw/?sw=" + n + "&amt=20&cur=SEK&msg=Haggween&src=qr"],
  ["Inget belopp (gammal sorts länk)", data({version: 1, payee: {value: n, editable: false}, message: {value: "Haggween", editable: true}})],
  ["Inget belopp (gammal sorts länk, enklast)", data({version: 1, payee: {value: n}, message: {value: "Haggween"}})],
  ["Förifyllt 20 kr (gammal sorts länk)", data({version: 1, payee: {value: n, editable: false}, amount: {value: 20, editable: true}, message: {value: "Haggween", editable: true}})],
];
document.getElementById("list").innerHTML = tests.map((x, i) =>
  `<a class="t" href="${x[1].replace(/"/g, "&quot;")}">Test ${i + 1}<small>${x[0]}</small></a>`).join("");
</script></body></html>
